name: CI - Python Calculator Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Si en el futuro necesitas instalar paquetes
          # pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest test_calculator.py -v
